# Placeholder environment config for the Phase 1 Go1 rough-terrain prototype.
task_name: Isaac-Velocity-Rough-Unitree-Go1-v0
num_envs: 16
headless: true
control_dt: 0.02
sim_dt: 0.005
obs:
  height_scan_mode: heightmap2d
  heightmap_size: [64, 64]
  heightmap_extent_m: [0.8, 0.5]
